apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: agroadvisory
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agroadvisory
      tier: backend
  template:
    metadata:
      labels:
        app: agroadvisory
        tier: backend
    spec:
      containers:
        - name: backend
          image: agri-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: agri-config
            - secretRef:
                name: agri-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
