apiVersion: v1
kind: ConfigMap
metadata:
  name: agri-config
  labels:
    app: agroadvisory
    tier: config
data:
  PORT: "5000"
  NODE_ENV: "production"
  DEFAULT_LOCATION_CITY: "Warangal"
  DEFAULT_LOCATION_STATE: "Telangana"
  DEFAULT_LOCATION_COUNTRY: "IN"
  RATE_LIMIT_MAX: "600"
  CORS_ORIGIN: "http://localhost:3000,http://frontend-service:80"
  MONGO_URI: "mongodb://mongodb-service:27017/agroadvisory"
